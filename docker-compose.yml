services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: az3d_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d az3d_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_REQUIRED: ${DATABASE_REQUIRED:-true}
      ADM_LOGIN: ${ADM_LOGIN:-}
      ADM_PASSWORD: ${ADM_PASSWORD:-}
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: az3d_db
      DB_PORT: 5432
      DB_SSLMODE: disable
      JWT_SECRET: change-me-in-production
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-168}
      REQUIRE_STRONG_SECRETS: ${REQUIRE_STRONG_SECRETS:-false}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      FRONTEND_BASE_URL: http://localhost
      API_PUBLIC_BASE_URL: http://localhost:8080
      MERCADO_PAGO_API_BASE_URL: https://api.mercadopago.com
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://localhost:8080/api/auth/google/callback}
      GOOGLE_OAUTH_AUTH_URL: ${GOOGLE_OAUTH_AUTH_URL:-https://accounts.google.com/o/oauth2/v2/auth}
      GOOGLE_OAUTH_TOKEN_URL: ${GOOGLE_OAUTH_TOKEN_URL:-https://oauth2.googleapis.com/token}
      GOOGLE_OAUTH_USERINFO_URL: ${GOOGLE_OAUTH_USERINFO_URL:-https://openidconnect.googleapis.com/v1/userinfo}
      CORREIOS_API_BASE_URL: ${CORREIOS_API_BASE_URL:-https://api.correios.com.br/srorastro}
      CORREIOS_TOKEN_BASE_URL: ${CORREIOS_TOKEN_BASE_URL:-https://api.correios.com.br/token}
      TRACKING_SYNC_INTERVAL_MINUTES: ${TRACKING_SYNC_INTERVAL_MINUTES:-0}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
