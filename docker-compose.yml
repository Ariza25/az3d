services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: az3d_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d az3d_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      ENV: production
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: az3d_db
      DB_PORT: 5432
      DB_SSLMODE: disable
      JWT_SECRET: change-me-in-production
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-168}
      REQUIRE_STRONG_SECRETS: ${REQUIRE_STRONG_SECRETS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      FRONTEND_BASE_URL: http://localhost
      API_PUBLIC_BASE_URL: http://localhost:8080
      MERCADO_PAGO_API_BASE_URL: https://api.mercadopago.com
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
